services:
  api:
    image: kttravel-api:local
    build:
      context: .
      dockerfile: infrastructure/docker/api.Dockerfile
    env_file: .env
    environment: &local-api-env
      NODE_ENV: development
      PORT: 4000
      DATABASE_URL: postgresql://kttravel:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/kttravel?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD}@redis:6379
      WEB_ORIGIN: http://localhost:8080
      SITE_URL: http://localhost:8080
      API_INTERNAL_URL: http://api:4000
      TRUST_PROXY: "1"
      NOTIFICATIONS_ENABLED: "0"
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    restart: unless-stopped
  worker:
    image: kttravel-api:local
    command: ["node", "apps/api/dist/apps/api/src/worker.js"]
    healthcheck:
      disable: true
    env_file: .env
    environment: *local-api-env
    depends_on:
      api: {condition: service_healthy}
    restart: unless-stopped
  web:
    build:
      context: .
      dockerfile: infrastructure/docker/web.Dockerfile
      args:
        API_INTERNAL_URL: http://api:4000
        SITE_URL: http://localhost:8080
    environment:
      API_INTERNAL_URL: http://api:4000
      SITE_URL: http://localhost:8080
      NODE_ENV: production
    depends_on:
      api: {condition: service_healthy}
    restart: unless-stopped
  nginx:
    image: nginx:1.28-alpine
    ports: ["127.0.0.1:8080:80"]
    volumes: ["./infrastructure/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro"]
    depends_on: [web]
    restart: unless-stopped
